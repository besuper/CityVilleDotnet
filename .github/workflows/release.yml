name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact_name: CityVilleDotnet-windows-x64
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: CityVilleDotnet-linux-x64
          - os: macos-latest
            runtime: osx-x64
            artifact_name: CityVilleDotnet-macos-x64
          - os: macos-latest
            runtime: osx-arm64
            artifact_name: CityVilleDotnet-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet publish CityVilleDotnet.Api/CityVilleDotnet.Api.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./publish

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish
          tar -czf ../${{ matrix.artifact_name }}-${{ steps.version.outputs.VERSION }}.tar.gz *
          cd ..

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd publish
          Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact_name }}-${{ steps.version.outputs.VERSION }}.zip
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}-${{ steps.version.outputs.VERSION }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/CityVilleDotnet-windows-x64/CityVilleDotnet-windows-x64-${{ steps.version.outputs.VERSION }}.zip
            artifacts/CityVilleDotnet-linux-x64/CityVilleDotnet-linux-x64-${{ steps.version.outputs.VERSION }}.tar.gz
            artifacts/CityVilleDotnet-macos-x64/CityVilleDotnet-macos-x64-${{ steps.version.outputs.VERSION }}.tar.gz
            artifacts/CityVilleDotnet-macos-arm64/CityVilleDotnet-macos-arm64-${{ steps.version.outputs.VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
