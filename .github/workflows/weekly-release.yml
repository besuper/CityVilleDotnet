name: Weekly release (2012 client)

on:
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: '2012'
          fetch-depth: 0

      - name: Generate version
        id: version
        run: echo "VERSION=2012-$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Check for changes since last release
        id: check
        run: |
          LAST_TAG=$(git tag --sort=-creatordate | grep '^v2012-' | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git log "$LAST_TAG"..HEAD --oneline)
            if [ -z "$CHANGES" ]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    name: Build
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact_name: CityVilleDotnet-windows-x64
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: CityVilleDotnet-linux-x64
          - os: macos-latest
            runtime: osx-x64
            artifact_name: CityVilleDotnet-macos-x64
          - os: macos-latest
            runtime: osx-arm64
            artifact_name: CityVilleDotnet-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: '2012'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet publish CityVilleDotnet.Api/CityVilleDotnet.Api.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:InformationalVersion=${{ needs.check-changes.outputs.version }} -o ./publish

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish
          tar -czf ../${{ matrix.artifact_name }}-${{ needs.check-changes.outputs.version }}.tar.gz *
          cd ..

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd publish
          Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact_name }}-${{ needs.check-changes.outputs.version }}.zip
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}-${{ needs.check-changes.outputs.version }}.*

  release:
    name: Create pre-release
    needs: [ check-changes, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: '2012'
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Generate changelog
        id: changelog
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.check-changes.outputs.version }}
        run: |
          LAST_TAG=$(git tag --sort=-creatordate | grep '^v2012-' | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%H %s (%aN)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%H %s (%aN)" "$LAST_TAG"..HEAD)
          fi

          CHANGELOG=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            HASH=$(echo "$line" | cut -d' ' -f1)
            SHORT_HASH=$(echo "$HASH" | cut -c1-7)
            MESSAGE=$(echo "$line" | cut -d' ' -f2-)
            CHANGELOG="${CHANGELOG}* ${MESSAGE} in ${SHORT_HASH}
          "
          done <<< "$COMMITS"

          if [ -n "$LAST_TAG" ]; then
            FULL_CHANGELOG="**Full Changelog**: https://github.com/${REPO}/compare/${LAST_TAG}...v${VERSION}"
          else
            FULL_CHANGELOG="**Full Changelog**: https://github.com/${REPO}/commits/v${VERSION}"
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "## What's Changed"
            echo "${CHANGELOG}"
            echo "${FULL_CHANGELOG}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-changes.outputs.version }}
          target_commitish: '2012'
          name: "CityVilleDotnet - v${{ needs.check-changes.outputs.version }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: true
          files: |
            artifacts/CityVilleDotnet-windows-x64/CityVilleDotnet-windows-x64-${{ needs.check-changes.outputs.version }}.zip
            artifacts/CityVilleDotnet-linux-x64/CityVilleDotnet-linux-x64-${{ needs.check-changes.outputs.version }}.tar.gz
            artifacts/CityVilleDotnet-macos-x64/CityVilleDotnet-macos-x64-${{ needs.check-changes.outputs.version }}.tar.gz
            artifacts/CityVilleDotnet-macos-arm64/CityVilleDotnet-macos-arm64-${{ needs.check-changes.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}