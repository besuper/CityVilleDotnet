version: 2
updates:
  - package-ecosystem: "nuget"
    directories: 
      - "/CityVilleDotnet.Api"
      - "/CityVilleDotnet.Common"
      - "/CityVilleDotnet.Domain"
      - "/CityVilleDotnet.Persistence"
      - "/FluorineFX"
      - "/test/CityVilleDotnet.Factory"
      - "/test/CityVilleDotnet.Test.Domain"
      - "/test/CityVilleDotnet.Test.Integration"
    schedule:
      interval: "weekly"
    groups:
      tests:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Testcontainers.*"
          - "AwesomeAssertions"
          - "Bogus"
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"
      others:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
