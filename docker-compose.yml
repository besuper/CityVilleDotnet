services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cityville-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Express
    volumes:
      - ./data:/var/opt/mssql/data
    networks:
      - cityville-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 25
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityville-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - URLS=http://0.0.0.0:5221
      - AllowedHosts=*
      - Serilog__WriteTo__0__Args__restrictedToMinimumLevel=Debug
      - ConnectionStrings__Database=Server=sqlserver,1433;Database=CityVille;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5221:5221"
    volumes:
      - ./wwwroot:/app/wwwroot
      - ./logs:/app/logs
    networks:
      - cityville-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

networks:
  cityville-network:
    driver: bridge